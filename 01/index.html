<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 매칭 미션</title>
  <style>
    body {
      font-family: 'Malgun Gothic', sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    /* 게임 보드 및 카드 스타일 */
    #game-container {
      max-width: 600px;
      margin: 0 auto;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background-color: #3498db;
      color: white;
      font-size: 24px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.3s;
    }

    .card.matched {
      background-color: #2ecc71;
      cursor: default;
    }

    /* 카드 조작 차단 클래스 */
    .cards-locked {
      pointer-events: none;
    }

    /* 컨트롤 버튼 */
    #restart-btn {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #restart-btn:disabled {
      background-color: #95a5a6;
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 모달 스타일 */
    .modal {
      display: none; /* 평소엔 숨김 */
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      position: relative;
      width: 300px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 왼쪽 상단 X 닫기 버튼 */
    .close-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: none;
      border: none;
      font-size: 22px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #000;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <h1>도덕 카드 맞추기 미션</h1>
    
    <!-- 카드 배치 영역 -->
    <div id="card-grid" class="card-grid">
      <div class="card matched" data-id="1">성실</div>
      <div class="card matched" data-id="1">성실</div>
      <div class="card matched" data-id="2">배려</div>
      <div class="card matched" data-id="2">배려</div>
    </div>

    <!-- 재시작 버튼 -->
    <button id="restart-btn" onclick="restartGame()">다시 시작</button>
  </div>

  <!-- 미션 성공 모달창 -->
  <div id="mission-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <button id="close-modal-btn" class="close-btn">×</button>
      <h2>🎉 미션 성공!</h2>
      <p>훌륭합니다! 카드를 모두 맞췄습니다.</p>
    </div>
  </div>

  <script>
    // 테스트를 위해 페이지 로드 시 바로 미션 성공 상태를 시뮬레이션하도록 구현
    // (실제 게임 로직에서는 모든 카드가 맞추어졌을 때 이 함수를 호출하세요)
    function triggerMissionSuccess() {
      // 1. 모달창 표시
      const modal = document.getElementById('mission-modal');
      modal.style.display = 'flex';

      // 2. 재시작 버튼 비활성화 (다시 시작할 수 없도록 차단)
      const restartBtn = document.getElementById('restart-btn');
      restartBtn.disabled = true;

      // 3. 카드 그리드에 클릭 방지 클래스 추가 (맞춘 카드 모양은 그대로 유지됨)
      const cardGrid = document.getElementById('card-grid');
      cardGrid.classList.add('cards-locked');
    }

    // 왼쪽 상단 X 버튼 기능 연결
    document.getElementById('close-modal-btn').addEventListener('click', function() {
      const modal = document.getElementById('mission-modal');
      modal.style.display = 'none'; // 모달만 닫기 (카드는 맞춘 상태 그대로 화면에 유지됨)
    });

    // 다시 시작 버튼 기능
    function restartGame() {
      alert('게임을 다시 시작합니다!');
      // 초기화 로직 구현부
    }

    // 예시 실행: 페이지가 열리고 0.5초 뒤 미션 성공 모달이 뜨는 시나리오 연출
    window.onload = function() {
      setTimeout(triggerMissionSuccess, 500);
    };
  </script>

</body>
</html>
